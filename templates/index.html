<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoMobile - Authentication</title>
    <!-- Bootstrap via CDN for quick styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- Register Form -->
        <div class="col-md-5 me-md-3 bg-white p-4 rounded shadow-sm">
            <h3 class="mb-3">Sign Up</h3>
            <form id="register-form">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" class="form-control" name="phone">
                </div>
                <div class="mb-3">
                    <label>Role</label>
                    <select class="form-select" name="role">
                        <option value="customer">Customer</option>
                        <option value="mechanic">Mechanic</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
                <div id="register-message" class="mt-3"></div>
            </form>
        </div>

        <!-- Login Form -->
        <div class="col-md-5 ms-md-3 bg-white p-4 rounded shadow-sm mt-4 mt-md-0">
            <h3 class="mb-3">Login</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
                <div id="login-message" class="mt-3"></div>
            </form>

            <div class="mt-4 border-top pt-3">
                <h5>Current Status</h5>
                <button id="btn-check-auth" class="btn btn-outline-info w-100">Check Me API</button>
                <pre id="auth-output" class="mt-2 bg-light p-2 rounded"></pre>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
</body>
</html>
