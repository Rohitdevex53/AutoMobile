<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoMobile - Mechanic Onboarding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .onboarding-container { max-width: 600px; margin: 50px auto; padding: 30px; background: #1b1b22; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .onboarding-header { text-align: center; margin-bottom: 30px; }
        .onboarding-header h1 { color: #f2f2f2; font-size: 24px; font-weight: 700; }
        .onboarding-header p { color: #888; }
        .form-label { color: #ccc; }
        .form-control { background: #25252d; border: 1px solid #333; color: #fff; }
        .form-control:focus { background: #25252d; border-color: #007bff; color: #fff; box-shadow: none; }
        .location-pill { display: inline-flex; align-items: center; padding: 6px 12px; background: #007bff22; border: 1px solid #007bff; border-radius: 20px; color: #007bff; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .location-pill:hover { background: #007bff; color: #fff; }
        .location-details { font-size: 0.85rem; color: #28a745; margin-top: 5px; display: none; }
        .btn-submit { background: #007bff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 600; margin-top: 20px; color: #fff; }
        .btn-submit:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="onboarding-header">
            <h1>Mechanic Onboarding</h1>
            <p>Please provide your professional details for verification.</p>
        </div>
        <form id="mechanic-onboarding-form" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Shop/Business Address</label>
                <textarea class="form-control" name="address" rows="3" placeholder="Enter your full business or workshop address..." required></textarea>
                <div id="get-location-pill" class="location-pill">
                    <span class="me-2">📍</span> Get Current Location
                </div>
                <div id="location-status" class="location-details">
                    Location fetched: <span id="lat-display"></span>, <span id="long-display"></span>
                </div>
                <input type="hidden" name="latitude" id="lat-input">
                <input type="hidden" name="longitude" id="long-input">
            </div>

            <div class="mb-3">
                <label class="form-label">Service Radius (KM)</label>
                <input type="number" class="form-control" name="service_radius_km" value="10" min="1" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mechanic License (Doc/Img)</label>
                    <input type="file" class="form-control" name="license_doc" accept="image/*,.pdf" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Identity ID (Aadhar/Voter ID)</label>
                    <input type="file" class="form-control" name="id_doc" accept="image/*,.pdf" required>
                </div>
            </div>

            <button type="submit" class="btn btn-submit">Submit for Verification</button>
            <div id="onboarding-message" class="mt-3 text-center"></div>
        </form>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        $(document).ready(function() {
            const token = localStorage.getItem('access_token');
            if(!token) {
                window.location.href = '/login/';
                return;
            }

            // Fill existing info if any
            $.ajax({
                url: '/auth/mechanic/onboarding/',
                type: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(data) {
                    if (data.address) $('textarea[name="address"]').val(data.address);
                    if (data.service_radius_km) $('input[name="service_radius_km"]').val(data.service_radius_km);
                    if (data.latitude && data.longitude) {
                        $('#lat-input').val(data.latitude);
                        $('#long-input').val(data.longitude);
                        $('#lat-display').text(data.latitude);
                        $('#long-display').text(data.longitude);
                        $('#location-status').show();
                    }
                }
            });

            $('#get-location-pill').click(function() {
                const $pill = $(this);
                $pill.html('<span class="spinner-border spinner-border-sm me-2"></span> Fetching...');
                console.log("Attempting to fetch location...");
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            console.log("Location fetched successfully", position.coords);
                            const lat = position.coords.latitude;
                            const long = position.coords.longitude;
                            $('#lat-input').val(lat.toFixed(6));
                            $('#long-input').val(long.toFixed(6));
                            $('#lat-display').text(lat.toFixed(6));
                            $('#long-display').text(long.toFixed(6));
                            $('#location-status').show();
                            $pill.html('<span>📍</span> Location Captured').css('background', '#28a74522').css('border-color', '#28a745').css('color', '#28a745');

                            // Auto-fill address using Nominatim (OpenStreetMap)
                            console.log("Fetching human-readable address...");
                            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${long}`)
                                .then(response => response.json())
                                .then(data => {
                                    if (data.display_name) {
                                        $('textarea[name="address"]').val(data.display_name);
                                        console.log("Address auto-filled:", data.display_name);
                                    }
                                })
                                .catch(err => console.error("Reverse geocoding failed:", err));
                        },
                        function(error) {
                            console.error("Geolocation error:", error);
                            let errorMsg = 'Error getting location: ';
                            switch(error.code) {
                                case error.PERMISSION_DENIED:
                                    errorMsg += "User denied the request for Geolocation. Please allow location access in your browser settings.";
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    errorMsg += "Location information is unavailable.";
                                    break;
                                case error.TIMEOUT:
                                    errorMsg += "The request to get user location timed out.";
                                    break;
                                case error.UNKNOWN_ERROR:
                                    errorMsg += "An unknown error occurred.";
                                    break;
                            }
                            alert(errorMsg);
                            $pill.html('<span>📍</span> Get Current Location');
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    alert('Geolocation is not supported by your browser or is blocked by non-secure context (HTTP).');
                    $pill.html('<span>📍</span> Get Current Location');
                }
            });

            $('#mechanic-onboarding-form').on('submit', function(e) {
                e.preventDefault();
                const form = this;
                const formData = new FormData(form);
                const $message = $('#onboarding-message');
                const $btn = $('.btn-submit');

                $btn.prop('disabled', true).text('Submitting...');
                $message.empty();

                $.ajax({
                    url: '/auth/mechanic/onboarding/',
                    type: 'PATCH',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: { 'Authorization': 'Bearer ' + token },
                    success: function(response) {
                        $message.html('<div class="text-success">Profile submitted successfully! Redirecting to login...</div>');
                        setTimeout(function() {
                            // Clear tokens to force a fresh login for the newly verified/pending profile
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('refresh_token');
                            window.location.href = '/login/';
                        }, 2000);
                    },
                    error: function(xhr) {
                        $btn.prop('disabled', false).text('Submit for Verification');
                        $message.html('<div class="text-danger">Error: ' + JSON.stringify(xhr.responseJSON) + '</div>');
                    }
                });
            });
        });
    </script>
</body>
</html>
